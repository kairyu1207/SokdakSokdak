<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>실시간 채팅</title>
    <style>
        /* ========================== */
        /* ===== 공통 색상 & 폰트 ===== */
        /* ========================== */
        :root {
            --bg1: #f7fbfb;
            --bg2: #eaf6f4;
            --primary1: #9ad3c7;
            --primary2: #6fa8b7;
            --accent: #f7b267;
            --text-dark: #103534;
            --text-light: #667a77;
            --border-radius: 12px;
            --shadow-light: rgba(0,0,0,0.08);
            --font-main: "Noto Sans KR", "Inter", sans-serif;
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: var(--font-main);
            background: linear-gradient(180deg, var(--bg1), var(--bg2));
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            line-height: 1.5;
            padding: 20px;
        }

        h1 { text-align: center; margin-bottom: 20px; font-size: 2rem; font-weight: 900; color: var(--text-dark); }

        /* ========================== */
        /* ===== 채팅 컨테이너 ===== */
        /* ========================== */
        #chat-box {
            width: 100%;
            max-width: 600px;
            height: 400px;
            background: #fff;
            border-radius: var(--border-radius);
            box-shadow: 0 8px 24px var(--shadow-light);
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        .message {
            padding: 10px 14px;
            border-radius: var(--border-radius);
            max-width: 80%;
            word-wrap: break-word;
        }

        .user {
            background-color: var(--primary1);
            align-self: flex-end;
            text-align: right;
            color: #083235;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        .ai {
            background-color: var(--accent);
            align-self: flex-start;
            text-align: left;
            color: #083235;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        /* ========================== */
        /* ===== 입력 폼 ===== */
        /* ========================== */
        form {
            display: flex;
            width: 100%;
            max-width: 600px;
        }

        input {
            flex: 1;
            padding: 12px 14px;
            border-radius: var(--border-radius);
            border: 1px solid #ccd8d6;
            outline: none;
            font-size: 1rem;
        }

        button {
            padding: 12px 24px;
            margin-left: 8px;
            border-radius: var(--border-radius);
            border: none;
            background: linear-gradient(90deg, var(--primary1), var(--primary2));
            color: #083235;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(0,0,0,0.15);
        }

        /* ========================== */
        /* ===== Footer ======== */
        footer {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-light);
            margin-top: 20px;
            width: 100%;
        }

        /* ========================== */
        /* ===== 반응형 ======== */
        @media (max-width: 480px) {
            #chat-box { height: 300px; padding: 12px; }
            input, button { font-size: 0.9rem; padding: 10px 12px; }
        }
    </style>
</head>

<body>
    <h1>실시간 채팅</h1>
    <div id="chat-box"></div>

    <form id="chat-form">
        <input id="message" name="message" type="text" placeholder="메시지를 입력하세요" required>
        <button type="submit">전송</button>
    </form>

    <footer>© 2025 속닥속닥 — 마음을 가까이</footer>

    <script>
        const form = document.getElementById("chat-form");
        const chatBox = document.getElementById("chat-box");

        const urlParams = new URLSearchParams(window.location.search);
        const studentId = urlParams.get("student_id");
        if (!studentId) {
            alert("학생 ID가 없습니다.");
            window.location.href = "login.html";
        }

        function addMessage(text, type) {
            const msg = document.createElement("div");
            msg.classList.add("message", type);
            msg.textContent = text;
            chatBox.appendChild(msg);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const message = document.getElementById("message").value;
            addMessage(message, "user");

            const response = await fetch("/chat.html", {
                method: "POST",
                headers: {"Content-Type": "application/x-www-form-urlencoded"},
                body: new URLSearchParams({ message: message, student_id: studentId })
            });

            const data = await response.json();
            addMessage(data.ai_response, "ai");
            document.getElementById("message").value = "";
        });
    </script>
</body>
</html>
